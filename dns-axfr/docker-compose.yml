services:
  dns:
    build: .
    container_name: dns-axfr-lab

    ports:
      - "127.0.0.1:15353:53/tcp"
      - "127.0.0.1:15353:53/udp"

    volumes:
      - ./named.conf.options:/etc/bind/named.conf.options:ro
      - ./named.conf.local:/etc/bind/named.conf.local:ro
      - ./db.lab.test:/etc/bind/db.lab.test:ro

    restart: unless-stopped
